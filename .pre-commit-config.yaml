default_install_hook_types: [pre-commit, pre-push, commit-msg]

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: check-yaml
    args: ['--allow-multiple-documents']
  - id: detect-private-key

- repo: local
  hooks:
    - id: commit-message-style
      name: commit message style
      language: pygrep
      entry: '^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-zA-Z0-9\-._]+\))?(!)?: [A-Za-z0-9](?:[^\n]*(?:\.\.\.|\.[a-zA-Z0-9]|[^\n.][^\n.])|[^\n.])?(\n[\s\S]*)?$'
      args: [--multiline, --negate]
      stages: [commit-msg]
      always_run: true

    - id: commit-message-length
      name: commit message first paragraph length (<= 69 chars)
      language: pygrep
      entry: '\A[^\n]{1,69}(\n|\Z)'
      args: [--negate]
      stages: [commit-msg]
      always_run: true

    - id: cargo-fmt
      name: cargo fmt
      language: system
      entry: pixi run cargo fmt --
      types: [rust]
