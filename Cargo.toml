[package]
name = "orna"
version = "0.1.0"
edition = "2024"
description = "Procedural Art Nouveau botanical illustration engine"
license = "GPL-3.0-or-later"

[lib]
name = "orna"
path = "src/lib.rs"

[[bin]]
name = "orna"
path = "src/main.rs"

[dependencies]
kurbo = { version = "0.13", features = ["serde"] }
svg = "0.18"
resvg = "0.48"
rand = "0.10"
rand_chacha = "0.10"
noise = "0.9"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
rayon = "1.12"

[profile.release]
opt-level = 3
