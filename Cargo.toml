[package]
name = "orna"
version = "0.1.0"
edition = "2024"
description = "Procedural Art Nouveau botanical illustration engine"
license = "AGPL-3.0-or-later"

[lib]
name = "orna"
path = "src/lib.rs"

[[bin]]
name = "orna"
path = "src/main.rs"

[dependencies]
kurbo = { version = "0.13", features = ["serde"] }
svg = "0.18"
resvg = "0.48"
rand = "0.10"
rand_chacha = "0.10"
noise = "0.9"
palette = { version = "0.7", default-features = false, features = ["std"] }
clap = { version = "4.6", features = ["derive"] }
anstream = "1"
owo-colors = "4.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
rayon = "1.12"

[profile.release]
opt-level = 3

# Light optimisation in debug builds: the geometry tests are numerically heavy, and
# unoptimised runs take a minute. Dependencies (resvg, kurbo) get full optimisation.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
